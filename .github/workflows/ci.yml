name: CI

on:
  pull_request:
    branches: [main]
    # `edited` covers a base-branch retarget: PR #114 was opened against a
    # spec branch, retargeted to main, and had zero runs until this line.
    types: [opened, synchronize, reopened, edited]
  # A squash merge creates a commit no pull-request run ever covered, so main
  # commits need their own run: `livewire_ops.py release promote` will only
  # build an artifact from a SHA that has a completed, successful run here.
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v5

      - name: Check lockfile is up-to-date
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --dev

      # Diff-based, so it only means anything on a pull request. On a push to
      # main the diff is against main itself; the merged content was already
      # scanned by that pull request's run.
      - name: Fetch base branch for diff
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.event.pull_request.base.ref }}

      - name: Secrets scan
        if: github.event_name == 'pull_request'
        run: bash tools/pre-commit-secrets-scan.sh --ci ${{ github.event.pull_request.base.ref }}

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      - name: Pytest
        run: uv run pytest tests/ --cov --cov-fail-under=95 -W error::RuntimeWarning

      # The alert path is Node, and every scheduled failure page goes through it.
      # Pytest cannot reach it, so an untested alert regression ships silently —
      # the exact shape of the quoted-printable digest corruption.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: npm ci

      - name: Node alert tests
        run: npm run test:alerts
